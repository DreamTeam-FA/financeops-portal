<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a73e8"/>
      <stop offset="100%" style="stop-color:#0d47a1"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.18)"/>
      <stop offset="100%" style="stop-color:rgba(255,255,255,0)"/>
    </linearGradient>
  </defs>
  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- Shine overlay -->
  <rect width="512" height="256" rx="112" fill="url(#shine)"/>
  <!-- Landmark / bank icon — columns + roof + base -->
  <!-- Roof / pediment -->
  <polygon points="256,100 408,180 104,180" fill="white" opacity="0.95"/>
  <!-- Columns (5) -->
  <rect x="128" y="190" width="28" height="160" rx="4" fill="white" opacity="0.90"/>
  <rect x="178" y="190" width="28" height="160" rx="4" fill="white" opacity="0.90"/>
  <rect x="228" y="190" width="28" height="160" rx="4" fill="white" opacity="0.90"/>
  <rect x="278" y="190" width="28" height="160" rx="4" fill="white" opacity="0.90"/>
  <rect x="328" y="190" width="28" height="160" rx="4" fill="white" opacity="0.90"/>
  <!-- Base -->
  <rect x="108" y="355" width="296" height="22" rx="4" fill="white" opacity="0.90"/>
  <!-- Bottom step -->
  <rect x="88" y="380" width="336" height="20" rx="4" fill="white" opacity="0.80"/>
</svg>
